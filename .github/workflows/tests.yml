name: tests

on:
  push:
  pull_request:

jobs:
  offline-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install offline-test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Run tests
        run: python -m pytest -q

  runtime-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install complete runtime
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Import ML and API stack
        run: >-
          python -c "import clip, cv2, torch, ultralytics;
          from app.main import app;
          print(cv2.__version__, torch.__version__, ultralytics.__version__, app.version)"
